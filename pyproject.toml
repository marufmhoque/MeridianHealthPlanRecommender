[project]
name = "meridian-pa"
version = "0.1.0"
description = "Agentic prior-authorization decision support for Meridian Health Plan nurse reviewers"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
