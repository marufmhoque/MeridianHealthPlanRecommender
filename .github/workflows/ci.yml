name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    env:
      MERIDIAN_DISABLE_LLM: "1"
      MERIDIAN_REVIEW_DATE: "2026-11-06"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Evaluation gate on synthetic cases (fails if any recommendation regresses)
        run: python scripts/run_all.py tests/fixtures/requests --expected tests/fixtures/expected.json --out ci-results --fresh

  docker:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meridian-pa .
      - name: Tests inside the image
        run: docker run --rm -e MERIDIAN_DISABLE_LLM=1 meridian-pa pytest -q
